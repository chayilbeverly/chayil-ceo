<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chayil · Personal CEO Operating System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app">
  <!-- 左侧固定导航栏 -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-mark">C</div>
      <div class="brand-text">
        <div class="brand-name">Chayil</div>
        <div class="brand-sub">Personal CEO OS</div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <a class="nav-item active" data-route="daily-plan">
        <span class="nav-icon">◆</span>
        <span class="nav-label">每日计划</span>
      </a>
      <a class="nav-item" data-route="inspiration">
        <span class="nav-icon">✦</span>
        <span class="nav-label">灵感中心</span>
      </a>
      <a class="nav-item" data-route="radar">
        <span class="nav-icon">◎</span>
        <span class="nav-label">爆款雷达</span>
      </a>
      <a class="nav-item" data-route="review">
        <span class="nav-icon">❖</span>
        <span class="nav-label">内容复盘</span>
      </a>
      <a class="nav-item" data-route="finance">
        <span class="nav-icon">₣</span>
        <span class="nav-label">财务管理</span>
      </a>
      <a class="nav-item" data-route="english">
        <span class="nav-icon">♢</span>
        <span class="nav-label">英语学习</span>
      </a>
      <a class="nav-item" data-route="assets">
        <span class="nav-icon">◈</span>
        <span class="nav-label">我的资产库</span>
      </a>
    </nav>
    <div class="sidebar-footer">
      <div class="streak-badge">
        <div class="streak-num" id="sidebarStreak">0</div>
        <div class="streak-label">连续完成天数</div>
      </div>
    </div>
  </aside>

  <!-- 主内容区 -->
  <main class="main" id="mainContent">
    <!-- 顶部栏 -->
    <header class="topbar">
      <div class="topbar-left">
        <h1 class="page-title" id="pageTitle">每日计划</h1>
        <span class="page-date" id="pageDate"></span>
      </div>
      <div class="topbar-right">
        <button class="btn btn-ghost" id="ceoReportBtn">
          <span class="btn-ico">☀</span> CEO 日报
        </button>
      </div>
    </header>

    <!-- 视图容器 -->
    <div class="view-container" id="viewContainer">
      <!-- 各模块视图由 JS 动态渲染 -->
    </div>
  </main>
</div>

<!-- CEO 日报 弹窗 -->
<div class="modal-overlay" id="ceoModal">
  <div class="modal">
    <div class="modal-header">
      <div>
        <div class="modal-eyebrow">CHAYIL 早安日报</div>
        <h2 class="modal-title" id="ceoDateTitle">早安</h2>
      </div>
      <button class="modal-close" onclick="App.closeCeoModal()">×</button>
    </div>
    <div class="modal-body" id="ceoModalBody"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/modules/daily-plan.js"></script>
<script src="js/modules/inspiration.js"></script>
<script src="js/modules/radar.js"></script>
<script src="js/modules/review.js"></script>
<script src="js/modules/finance.js"></script>
<script src="js/modules/assets.js"></script>
<script src="js/modules/english.js"></script>
<script src="js/app.js"></script>
</body>
</html>
