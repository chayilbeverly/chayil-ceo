<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Chayil · Personal CEO Operating System</title>

<!-- PWA Meta -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chayil">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1A1A2E">
<meta name="description" content="个人创业者的商业操作系统">

<!-- PWA Manifest & Icons -->
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app">
  <!-- 左侧固定导航栏（桌面端） -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-mark">C</div>
      <div class="brand-text">
        <div class="brand-name">Chayil</div>
        <div class="brand-sub">Personal CEO OS</div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <a class="nav-item active" data-route="home">
        <span class="nav-icon">◈</span>
        <span class="nav-label">首页驾驶舱</span>
      </a>
      <a class="nav-item" data-route="daily-plan">
        <span class="nav-icon">◆</span>
        <span class="nav-label">每日计划</span>
      </a>
      <a class="nav-item" data-route="inspiration">
        <span class="nav-icon">✦</span>
        <span class="nav-label">灵感中心</span>
      </a>
      <a class="nav-item" data-route="radar">
        <span class="nav-icon">◎</span>
        <span class="nav-label">爆款雷达</span>
      </a>
      <a class="nav-item" data-route="review">
        <span class="nav-icon">❖</span>
        <span class="nav-label">内容复盘</span>
      </a>
      <a class="nav-item" data-route="finance">
        <span class="nav-icon">₣</span>
        <span class="nav-label">财务管理</span>
      </a>
      <a class="nav-item" data-route="english">
        <span class="nav-icon">♢</span>
        <span class="nav-label">英语学习</span>
      </a>
      <a class="nav-item" data-route="assets">
        <span class="nav-icon">◈</span>
        <span class="nav-label">我的资产库</span>
      </a>
    </nav>
    <div class="sidebar-footer">
      <div class="streak-badge">
        <div class="streak-num" id="sidebarStreak">0</div>
        <div class="streak-label">连续完成天数</div>
      </div>
      <div class="sync-indicator" id="syncIndicator" title="点击查看同步状态">
        <span class="sync-dot" id="syncDot"></span>
        <span class="sync-text" id="syncText">已连接</span>
      </div>
    </div>
  </aside>

  <!-- 主内容区 -->
  <main class="main" id="mainContent">
    <!-- 顶部栏 -->
    <header class="topbar">
      <div class="topbar-left">
        <h1 class="page-title" id="pageTitle">每日计划</h1>
        <span class="page-date" id="pageDate"></span>
      </div>
      <div class="topbar-right">
        <!-- 同步状态指示器 -->
        <button class="btn btn-ghost" id="syncStatusBtn" title="点击查看同步详情">
          <span class="sync-dot-top" id="syncDotTop"></span>
          <span id="syncLabel">☁ 已连接</span>
        </button>
        <button class="btn btn-ghost" id="ceoReportBtn">
          <span class="btn-ico">☀</span> CEO 日报
        </button>
        <button class="btn btn-ghost" id="logoutBtn" title="退出登录">
          <span class="btn-ico">↩</span>
        </button>
      </div>
    </header>

    <!-- 视图容器 -->
    <div class="view-container" id="viewContainer">
      <!-- 各模块视图由 JS 动态渲染 -->
    </div>
  </main>
</div>

<!-- CEO 日报 弹窗 -->
<div class="modal-overlay" id="ceoModal">
  <div class="modal">
    <div class="modal-header">
      <div>
        <div class="modal-eyebrow">CHAYIL 早安日报</div>
        <h2 class="modal-title" id="ceoDateTitle">早安</h2>
      </div>
      <button class="modal-close" onclick="App.closeCeoModal()">×</button>
    </div>
    <div class="modal-body" id="ceoModalBody"></div>
  </div>
</div>

<!-- 移动端底部导航栏 -->
<nav class="mobile-nav" id="mobileNav">
  <a class="mnav-item active" data-mroute="home">
    <span class="mnav-icon">◈</span>
    <span class="mnav-label">首页</span>
  </a>
  <a class="mnav-item" data-mroute="daily-plan">
    <span class="mnav-icon">◆</span>
    <span class="mnav-label">任务</span>
  </a>
  <a class="mnav-item" data-mroute="assets">
    <span class="mnav-icon">◈</span>
    <span class="mnav-label">客户</span>
  </a>
  <a class="mnav-item" data-mroute="inspiration">
    <span class="mnav-icon">✦</span>
    <span class="mnav-label">内容</span>
  </a>
  <a class="mnav-item" id="mnavSync">
    <span class="mnav-icon">☁</span>
    <span class="mnav-label">同步</span>
  </a>
</nav>

<!-- Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

<!-- 应用脚本 -->
<script src="js/supabase.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/modules/home.js"></script>
<script src="js/modules/daily-plan.js"></script>
<script src="js/modules/inspiration.js"></script>
<script src="js/modules/radar.js"></script>
<script src="js/modules/review.js"></script>
<script src="js/modules/finance.js"></script>
<script src="js/modules/assets.js"></script>
<script src="js/modules/english.js"></script>
<script src="js/app.js"></script>

<!-- 注册 Service Worker -->
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('service-worker.js', { scope: '/chayil-ceo/' })
      .then(function (reg) { console.log('[PWA] Service Worker 已注册:', reg.scope); })
      .catch(function (err) { console.warn('[PWA] Service Worker 注册失败:', err); });
  });
}

// 顶部同步状态更新（从 App 轮询驱动）
setInterval(function () {
  var dot = document.getElementById('syncDotTop');
  var label = document.getElementById('syncLabel');
  var cloudVer = Store.getCloudVersion ? Store.getCloudVersion() : null;
  if (!dot || !label) return;
  dot.className = 'sync-dot-top';
  if (!Supa.getUserId || !Supa.getUserId()) {
    dot.classList.add('sync-off');
    label.textContent = '⚠ 离线';
  } else if (cloudVer) {
    dot.classList.add('sync-on');
    label.textContent = '☁ 已同步';
  } else {
    dot.classList.add('sync-on');
    label.textContent = '☁ 已连接';
  }
}, 3000);
</script>
</body>
</html>
